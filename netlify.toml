# Netlify deploy for the TerraTone web app.
#
# The owner's API keys are NOT in this repo. Add them in the Netlify UI
# (Site configuration → Environment variables), without a VITE_ prefix so they
# stay server-side and are only read by the functions in netlify/functions:
#   GEMINI_API_KEY   NPC chat + AI explanations for every visitor
#   NASA_API_KEY     APOD space photo (falls back to DEMO_KEY)
# Visitors who save their own keys in Settings → API keys use those instead.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The app calls these key-holding proxies when a visitor has no own key.
  VITE_API_PROXY = "/api"
  # Download buttons → direct downloads of the installers shared on Google
  # Drive (drive.usercontent.google.com with confirm=t skips Drive's preview
  # and "can't scan for viruses" pages, so the file saves straight away).
  # Upload a new build by replacing the file in Drive (Manage versions) to
  # keep the same ID. No macOS build: that button offers the web-app install.
  VITE_INSTALLER_PHONE = "https://drive.usercontent.google.com/download?id=1TTju_Si1JLo5EfuTCOo4R8vLCpyBlWwn&export=download&confirm=t"
  VITE_INSTALLER_WINDOWS = "https://drive.usercontent.google.com/download?id=1R3ib7MF40H9JKNJuHxCE1EFCK81xe8Kc&export=download&confirm=t"

[functions]
  directory = "netlify/functions"

# The service worker must always be re-checked, or visitors keep an old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
