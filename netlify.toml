# Netlify deploy for the TerraTone web app.
#
# The owner's API keys are NOT in this repo. Add them in the Netlify UI
# (Site configuration → Environment variables), without a VITE_ prefix so they
# stay server-side and are only read by the functions in netlify/functions:
#   GEMINI_API_KEY   NPC chat + AI explanations for every visitor
#   NASA_API_KEY     APOD space photo (falls back to DEMO_KEY)
# Visitors who save their own keys in Settings → API keys use those instead.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The app calls these key-holding proxies when a visitor has no own key.
  VITE_API_PROXY = "/api"
  # The public NASA API base URLs (VITE_CMR_API_BASE and VITE_FIRMS_API_BASE)
  # ship in the client bundle on purpose, so the scanner needs an omission for
  # their key names. It lives here because netlify.toml overrides the UI var —
  # but with the comma TOML-escaped (\u002c): the scanner also scans this file
  # for the values of SECRET-named env vars, and the plain comma-separated
  # value written here would make the build fail on its own config.
  SECRETS_SCAN_OMIT_KEYS = "VITE_CMR_API_BASE\u002cVITE_FIRMS_API_BASE"
  # Download buttons use the Google Drive installers built into
  # src/lib/install.ts (HOSTED_INSTALLERS); no setting needed here.

[functions]
  directory = "netlify/functions"

# The service worker must always be re-checked, or visitors keep an old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
