# Netlify deploy for the TerraTone web app.
#
# The owner's API keys are NOT in this repo. Add them in the Netlify UI
# (Site configuration → Environment variables), without a VITE_ prefix so they
# stay server-side and are only read by the functions in netlify/functions:
#   GEMINI_API_KEY   NPC chat + AI explanations for every visitor
#   NASA_API_KEY     APOD space photo (falls back to DEMO_KEY)
# Visitors who save their own keys in Settings → API keys use those instead.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The app calls these key-holding proxies when a visitor has no own key.
  VITE_API_PROXY = "/api"
  # Netlify's secret scanner false-positives on these two PUBLIC NASA endpoint
  # URLs: they ship in the client bundle on purpose (VITE_ = public) and are
  # hardcoded as fallbacks in src/lib/nasa.ts and src/lib/nasaApis.ts.
  # Omit the keys from standard scanning and the URL strings from smart
  # detection; neither value is a secret.
  SECRETS_SCAN_OMIT_KEYS = "VITE_CMR_API_BASE,VITE_FIRMS_API_BASE"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "https://cmr.earthdata.nasa.gov/search,https://firms.modaps.eosdis.nasa.gov/api,https://firms.modaps.eosdis.nasa.gov/api/map_key"
  # Download buttons use the Google Drive installers built into
  # src/lib/install.ts (HOSTED_INSTALLERS); no setting needed here.

[functions]
  directory = "netlify/functions"

# The service worker must always be re-checked, or visitors keep an old app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
